<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="VestraWAB">
  <!--
    The mark, not the wordmark.

    At 16px a wordmark is a grey smudge, so the favicon is a letter and a keel
    and nothing else. Colours are the Atlas palette by hand: cobalt-600 ground,
    a near-white V, and a gold keel. They cannot be tokens here — an SVG served
    as a file has no stylesheet, and a favicon has no theme.

    The V is drawn as an open stroke rather than a filled glyph so it holds its
    weight when the browser downsamples this to 16 square, where a filled
    counter closes up into a solid triangle.
  -->
  <rect width="64" height="64" rx="16" fill="#2F4AE0"/>
  <path d="M14 16.5 L32 47.5 L50 16.5" fill="none" stroke="#FFFFFF" stroke-width="7.5"
        stroke-linecap="square" stroke-linejoin="miter"/>
  <rect x="23" y="51" width="18" height="3.5" rx="1.75" fill="#C39A2E"/>
</svg>
