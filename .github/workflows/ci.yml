# Every push and pull request: typecheck, lint, unit tests, a seeded database,
# and a production build. The build prerenders catalogue pages from the
# database, so it runs after the seed, against a throwaway MongoDB service.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']

    env:
      APP_ENV: development
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB: vestra_ci
      AUTH_SECRET: ci-only-signing-key-that-is-long-enough-for-hmac
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_NAME: VestraWAB
      MEDIA_SOURCE: generated
      PAYMENT_PROVIDER: mock
      LIVE_PROVIDER: mock
      SHIPPING_PROVIDER: eshopbox
      ESHOPBOX_MODE: simulation
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # The seed script reads .env.local; in CI the values come from `env` above.
      - run: touch .env.local && npm run seed
      - run: npm run build